name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install MAUI workload
        run: dotnet workload install maui-android
      - name: Write secrets
        env:
          AIS_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          printf 'namespace ShipInfo.Services;\npublic static class Secrets { public const string AisKey = "%s"; }\n' "$AIS_KEY" > Services/Secrets.cs
      - name: Build APK
        run: dotnet publish ShipInfo.csproj -f net8.0-android -c Release -p:AndroidPackageFormat=apk
      - uses: actions/upload-artifact@v4
        with:
          name: ShipInfo-apk
          path: |
            **/publish/*.apk
            **/*-Signed.apk
